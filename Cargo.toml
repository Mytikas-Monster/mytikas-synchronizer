[package]
name = "mytikas-synchronizer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.7"
