name: Synchronizer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -- --ignored
      - run: docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t synchronizer:test .
      - name: Exercise the archive migration inside the tested image
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: docker run --rm --network "$SERVICE_NETWORK" -e ARCHIVE_DATABASE_URL=postgres://postgres:test-only@postgres:5432/postgres synchronizer:test migrate
      - if: github.repository == 'Mytikas-Monster/mytikas-synchronizer' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o /tmp/synchronizer.tar synchronizer:test
      - if: github.repository == 'Mytikas-Monster/mytikas-synchronizer' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-image
          path: /tmp/synchronizer.tar
          retention-days: 1
  image:
    needs: verify
    if: github.repository == 'Mytikas-Monster/mytikas-synchronizer' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-image
          path: /tmp
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/mytikas-monster/mytikas-synchronizer:$GITHUB_SHA"
          docker load -i /tmp/synchronizer.tar
          docker tag synchronizer:test "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
